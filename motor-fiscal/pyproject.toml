[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-fiscal"
version = "0.1.0"
description = "Motor fiscal em Python: ingestao de XMLs (NF-e/NFC-e/CT-e/CF-e) e EFDs em SQLite, auditoria e apuracoes (substituto do ControlDocs)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
painel = [
    "streamlit>=1.32",
]
dev = [
    "pytest>=8",
    "streamlit>=1.32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
