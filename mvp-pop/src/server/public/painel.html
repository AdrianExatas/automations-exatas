<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel — MVP POP</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Exatas · Painel</div>
    <nav class="nav">
      <a href="/">Envio</a>
      <a href="/validacao">Validação</a>
      <a href="/painel">Painel</a>
      <a href="/indice">Índice Mestre</a>
    </nav>
  </header>
  <main class="wrap">
    <h1>Acompanhamento</h1>
    <p class="lead">Fila por status, volume por setor e documentos próximos da revisão.</p>
    <div id="stats" class="stat-grid"></div>
    <div class="panel" style="margin-bottom:1rem;">
      <h2 style="margin-top:0;font-size:1.1rem;">Por status</h2>
      <table><thead><tr><th>Status</th><th>Qtd</th></tr></thead><tbody id="byStatus"></tbody></table>
    </div>
    <div class="panel" style="margin-bottom:1rem;">
      <h2 style="margin-top:0;font-size:1.1rem;">Por setor</h2>
      <table><thead><tr><th>Setor</th><th>Qtd</th></tr></thead><tbody id="bySetor"></tbody></table>
    </div>
    <div class="panel" style="margin-bottom:1rem;">
      <h2 style="margin-top:0;font-size:1.1rem;">Próximos da revisão</h2>
      <table><thead><tr><th>Código</th><th>Documento</th><th>Revisão</th></tr></thead><tbody id="rev"></tbody></table>
    </div>
    <div class="panel">
      <h2 style="margin-top:0;font-size:1.1rem;">Solicitações recentes</h2>
      <table>
        <thead><tr><th>Atividade</th><th>Setor</th><th>Status</th><th>Atualizado</th><th></th></tr></thead>
        <tbody id="recent"></tbody>
      </table>
    </div>
  </main>
  <script src="/static/painel.js"></script>
</body>
</html>
