<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alterar Nota Fiscal - DIA Atual</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">SEFAZ-SE</p>
          <h1>Alterar Nota Fiscal - DIA Atual</h1>
          <p class="subtitle">Processamento por planilha para atualizar ICMS e forma de recolhimento.</p>
        </div>
        <div class="status" id="status-text">Carregando...</div>
      </section>

      <section class="workspace">
        <form id="run-form" class="panel">
          <div class="section-title">Acesso</div>
          <label>
            <span>Login</span>
            <input id="user" type="text" autocomplete="username" required />
          </label>
          <label>
            <span>Senha</span>
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <div class="row">
            <label class="check">
              <input id="remember" type="checkbox" />
              <span>Lembrar login e senha</span>
            </label>
            <button id="forget" type="button" class="ghost">Esquecer</button>
          </div>

          <div class="section-title">Execucao</div>
          <label>
            <span>Planilha</span>
            <div class="path-row">
              <input id="spreadsheet" type="text" required />
              <button id="select-spreadsheet" type="button" class="icon-button" title="Selecionar planilha">...</button>
            </div>
          </label>
          <label>
            <span>Pasta de saida</span>
            <div class="path-row">
              <input id="out-dir" type="text" required />
              <button id="select-out-dir" type="button" class="icon-button" title="Selecionar pasta">...</button>
            </div>
          </label>
          <label class="check">
            <input id="headless" type="checkbox" />
            <span>Executar navegador em segundo plano</span>
          </label>

          <div class="actions">
            <button id="start" type="submit" class="primary">Iniciar</button>
            <button id="cancel" type="button" disabled>Cancelar</button>
          </div>
        </form>

        <section class="panel monitor">
          <div class="summary">
            <div>
              <span id="success-count">0</span>
              <small>sucessos</small>
            </div>
            <div>
              <span id="error-count">0</span>
              <small>erros</small>
            </div>
            <div>
              <span id="total-count">0</span>
              <small>itens</small>
            </div>
          </div>

          <div class="progress-block">
            <progress id="progress" value="0" max="1"></progress>
            <div id="progress-text">0 de 0</div>
          </div>

          <pre id="logs" class="logs" aria-live="polite"></pre>

          <div class="actions">
            <button id="open-folder" type="button" disabled>Abrir pasta</button>
            <button id="open-report" type="button" disabled>Abrir relatorio</button>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
