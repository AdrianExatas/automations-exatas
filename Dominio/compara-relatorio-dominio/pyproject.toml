[project]
name = "compara-relatorio-dominio"
version = "0.1.0"
description = "Aplicacao local para comparar relatorios PDF do cliente e da Dominio."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pypdf>=5.4.0",
    "streamlit>=1.44.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

